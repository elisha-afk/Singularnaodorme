# Configuração do Supabase

[project]
project_id = "seu-project-id"
title = "SingularNãoDorme"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
smtp_port = 54324
pop3_port = 54325
web_port = 54326

[auth]
enabled = true
email_autoconfirm = false
phone_autoconfirm = false

[storage]
enabled = true
file_size_limit_bytes = 52428800

[realtime]
enabled = true
max_bytes_per_second = 1048576

[edge_runtime]
enabled = true
policy_mode = "permissive"
